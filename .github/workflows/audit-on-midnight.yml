name: npm audit on midnight

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        id: audit
        continue-on-error: true
        run: npm audit

      - name: Fix audit issues
        if: steps.audit.outcome == 'failure'
        run: npm audit fix

      - name: Create Pull Request
        if: steps.audit.outcome == 'failure'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix: npm audit vulnerabilities"
          title: "fix: npm audit vulnerabilities"
          body: |
            `npm audit` hat Sicherheitslücken gefunden.

            Dieser PR wurde automatisch mit `npm audit fix` erstellt.
          branch: automated/npm-audit-fix
          delete-branch: true
